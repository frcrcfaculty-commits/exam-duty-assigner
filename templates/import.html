{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md">
    <h1 class="text-3xl font-bold mb-6 text-crce-primary">Import Data Backup</h1>

    <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200 mb-6">
        <p class="text-sm text-yellow-800">
            <strong>⚠️ Warning:</strong> Importing a backup will <strong>replace all existing data</strong>.
            Make sure to export your current data first if needed.
        </p>
    </div>

    <form action="{{ url_for('import_data') }}" method="post" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Select Backup File</label>
            <div
                class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-crce-primary transition cursor-pointer relative">
                <input type="file" name="backup_file" accept=".json" required
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <div class="text-gray-500">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                        </path>
                    </svg>
                    <p class="mt-2 text-sm">Click to select a <strong>.json</strong> backup file</p>
                </div>
            </div>
        </div>

        <button type="submit"
            class="w-full bg-crce-primary text-white font-bold py-3 rounded-lg hover:bg-crce-secondary transition shadow-lg">
            Import & Restore Data
        </button>
    </form>

    <div class="mt-8 pt-6 border-t">
        <a href="{{ url_for('index') }}" class="text-crce-primary hover:text-crce-dark font-medium">
            ← Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
