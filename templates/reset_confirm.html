{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md text-center">
    <div class="text-6xl mb-4">⚠️</div>
    <h1 class="text-2xl font-bold text-red-600 mb-4">Reset All Data?</h1>

    <p class="text-gray-600 mb-6">
        This will permanently delete:
    </p>

    <ul class="text-left bg-red-50 p-4 rounded-lg mb-6 text-sm">
        <li class="mb-2">✗ All Faculty members</li>
        <li class="mb-2">✗ All Timetable entries</li>
        <li class="mb-2">✗ All Exam Sessions</li>
        <li>✗ All Duty Assignments</li>
    </ul>

    <p class="text-red-600 font-bold mb-6">This action cannot be undone!</p>

    <div class="flex space-x-4 justify-center">
        <a href="{{ url_for('index') }}"
            class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg transition">
            Cancel
        </a>
        <a href="{{ url_for('do_reset') }}"
            class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition">
            Yes, Delete Everything
        </a>
    </div>
</div>
{% endblock %}
