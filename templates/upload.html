{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md">
    <h1 class="text-3xl font-bold mb-6 text-indigo-700">Upload Department Timetables</h1>
    <p class="text-gray-600 mb-6">Upload multiple <strong>CSV or Excel</strong> files containing the block-structured
        timetables.</p>

    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data" class="space-y-6">
        <div
            class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-indigo-500 transition cursor-pointer relative">
            <input type="file" name="files" multiple required accept=".csv, .xlsx, .xls"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div class="text-gray-500">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                    </path>
                </svg>
                <p class="mt-2 text-sm">Click to browse or drag CSV/Excel files here</p>
            </div>
        </div>

        <button type="submit"
            class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-lg transform hover:-translate-y-0.5">
            Upload & Parse
        </button>
    </form>

    <div class="mt-8 pt-6 border-t">
        <h2 class="text-lg font-semibold text-gray-700 mb-2">Or Generate Dummy Data</h2>
        <form action="{{ url_for('generate_dummy') }}" method="post">
            <button type="submit" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z">
                    </path>
                </svg>
                Generate Fairness Test Data
            </button>
        </form>
    </div>
</div>
{% endblock %}
