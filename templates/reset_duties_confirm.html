{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md text-center">
    <div class="text-6xl mb-4">🔄</div>
    <h1 class="text-2xl font-bold text-orange-600 mb-4">Reset Exam Duties?</h1>

    <p class="text-gray-600 mb-6">
        This will clear:
    </p>

    <ul class="text-left bg-orange-50 p-4 rounded-lg mb-6 text-sm">
        <li class="mb-2">✗ All Exam Sessions</li>
        <li class="mb-2">✗ All Duty Assignments</li>
        <li class="mb-2">✗ Faculty duty counts (reset to 0)</li>
        <li class="text-green-600 font-medium">✓ Faculty list will be KEPT</li>
    </ul>

    <p class="text-orange-600 font-bold mb-6">Use this to start fresh semester duties!</p>

    <div class="flex space-x-4 justify-center">
        <a href="{{ url_for('index') }}"
            class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg transition">
            Cancel
        </a>
        <a href="{{ url_for('do_reset_duties') }}"
            class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-lg transition">
            Yes, Reset Duties
        </a>
    </div>
</div>
{% endblock %}
